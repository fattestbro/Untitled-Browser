name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Windows installer and portable EXE
        run: npx electron-builder --win nsis portable --publish never

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Untitled Browser Setup 1.1.0.exe" \
            "dist/Untitled Browser 1.1.0.exe" \
            --title "Untitled Browser ${GITHUB_REF_NAME#v}" \
            --generate-notes
